name: Build AlencarSoft TVBOX Binaries

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-csky:
    name: Build para Azamerica S1009+ (NationalChip GX6622 / C-SKY)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v3

      - name: Instalar dependencias e 32-bit libs
        run: |
          sudo apt-get update
          sudo apt-get install -y lib32z1 lib32stdc++6 file wget

      - name: Baixar Toolchain C-SKY (T-Head uClibc)
        run: |
          mkdir -p /opt/csky-toolchain
          wget -q "https://occ-oss-prod.oss-cn-hangzhou.aliyuncs.com/resource/1356021/1619527806432/csky-linux-uclibc-tools-x86_64-uclibc-linux-4.9.56-20210423.tar.gz" -O /tmp/csky.tar.gz
          tar -xzf /tmp/csky.tar.gz -C /opt/csky-toolchain
          echo "Toolchain extraida."

      - name: Compilar binario C-SKY
        run: |
          CC_BIN=$(find /opt/csky-toolchain -type f -name "*csky*gcc" | head -n 1)
          echo "Compilador: $CC_BIN"
          export PATH="$(dirname $CC_BIN):$PATH"
          $CC_BIN -v
          
          cd AlencarSoftTVBOX-Clang
          $CC_BIN -O2 -Wall -Iinclude -D_GNU_SOURCE \
            src/main.c \
            src/framebuffer.c \
            src/font.c \
            src/platform.c \
            src/display_vfd.c \
            src/input.c \
            src/iptv_catalog.c \
            src/player.c \
            -o alencarsoft_tvbox_csky 2>&1 | tee /tmp/compile_csky.log || true
          
          if [ -f alencarsoft_tvbox_csky ]; then
            echo "SUCESSO: Binario C-SKY gerado!"
            file alencarsoft_tvbox_csky
            ls -lh alencarsoft_tvbox_csky
          else
            echo "FALHA NA COMPILACAO:"
            cat /tmp/compile_csky.log
            exit 1
          fi

      - name: Upload Artifact C-SKY
        uses: actions/upload-artifact@v4
        with:
          name: alencarsoft_tvbox_csky
          path: AlencarSoftTVBOX-Clang/alencarsoft_tvbox_csky

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: latest
          name: "AlencarSoft TVBOX - Versao Nativa Estavel"
          draft: false
          prerelease: false
          files: |
            AlencarSoftTVBOX-Clang/alencarsoft_tvbox_csky
            AlencarSoftTVBOX-Clang/iptv.m3u8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
