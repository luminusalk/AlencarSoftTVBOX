name: Build AlencarSoft TVBOX Binaries

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-csky:
    name: Build para Azamerica S1009+ (NationalChip GX6622 / C-SKY)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v3

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y lib32z1 lib32stdc++6 file wget python3

      - name: Baixar Toolchain C-SKY (T-Head uClibc)
        run: |
          mkdir -p /opt/csky-toolchain
          wget -q "https://occ-oss-prod.oss-cn-hangzhou.aliyuncs.com/resource/1356021/1619527806432/csky-linux-uclibc-tools-x86_64-uclibc-linux-4.9.56-20210423.tar.gz" -O /tmp/csky.tar.gz
          tar -xzf /tmp/csky.tar.gz -C /opt/csky-toolchain
          echo "Toolchain extraida com sucesso."

      - name: Compilar binario C-SKY Estatico
        run: |
          CC_BIN=$(find /opt/csky-toolchain -type f -name "*gcc" | grep "/bin/" | head -n 1)
          STRIP_BIN=$(find /opt/csky-toolchain -type f -name "*strip" | grep "/bin/" | head -n 1)
          echo "Compilador selecionado: $CC_BIN"
          export PATH="$(dirname $CC_BIN):$PATH"
          $CC_BIN -v
          
          cd AlencarSoftTVBOX-Clang
          
          # Mostra opcoes de arquitetura do compilador
          $CC_BIN --target-help 2>&1 | grep -E "(ck610|ck810|ck807|abiv1|abiv2)" | head -n 30 || true
          
          # Tenta compilar especificamente para C-SKY ABIV1 (CK610)
          if $CC_BIN -static -mabi=abiv1 -march=ck610 -O2 -Wall -Wextra -Iinclude -D_GNU_SOURCE \
            src/main.c src/framebuffer.c src/font.c src/platform.c src/display_vfd.c \
            src/input.c src/iptv_catalog.c src/player.c -o alencarsoft_tvbox_csky 2>/tmp/abiv1.log; then
            echo "SUCESSO: Compilado com -mabi=abiv1 -march=ck610!"
          elif $CC_BIN -static -mcpu=ck610 -O2 -Wall -Wextra -Iinclude -D_GNU_SOURCE \
            src/main.c src/framebuffer.c src/font.c src/platform.c src/display_vfd.c \
            src/input.c src/iptv_catalog.c src/player.c -o alencarsoft_tvbox_csky 2>/tmp/ck610.log; then
            echo "Compilado com -mcpu=ck610!"
          else
            echo "Compilando padrao estatico:"
            cat /tmp/abiv1.log || true
            $CC_BIN -static -O2 -Wall -Wextra -Iinclude -D_GNU_SOURCE \
              src/main.c src/framebuffer.c src/font.c src/platform.c src/display_vfd.c \
              src/input.c src/iptv_catalog.c src/player.c -o alencarsoft_tvbox_csky
          fi
          
          if [ -n "$STRIP_BIN" ]; then
            $STRIP_BIN alencarsoft_tvbox_csky || true
          fi
          
          # Compila mini_test de diagnostico
          $CC_BIN -static -mabi=abiv1 -march=ck610 mini_test.c -o mini_test 2>/dev/null || \
          $CC_BIN -static mini_test.c -o mini_test
          if [ -n "$STRIP_BIN" ]; then
            $STRIP_BIN mini_test || true
          fi
          python3 -c '
          with open("mini_test", "r+b") as f:
              f.seek(18)
              f.write(bytes([0x27]))
          '
          
          # Compila nostdlib_test direto por syscall
          $CC_BIN -nostdlib -O2 nostdlib_test.c -o nostdlib_test
          if [ -n "$STRIP_BIN" ]; then
            $STRIP_BIN nostdlib_test || true
          fi
          python3 -c '
          with open("nostdlib_test", "r+b") as f:
              f.seek(18)
              f.write(bytes([0x27]))
          '
          
          # Versao moderna (e_machine = 0xFC / 252)
          cp alencarsoft_tvbox_csky alencarsoft_tvbox_csky_v2
          
          # Versao compativel com Kernel 3.0.8 (e_machine = 0x27 / 39)
          python3 -c '
          with open("alencarsoft_tvbox_csky", "r+b") as f:
              f.seek(18)
              f.write(bytes([0x27]))
          '
          
          echo "SUCESSO: Binarios C-SKY gerados com sucesso!"
          file alencarsoft_tvbox_csky*
          ls -lh alencarsoft_tvbox_csky*

      - name: Upload Artifact C-SKY
        uses: actions/upload-artifact@v4
        with:
          name: alencarsoft_tvbox_csky
          path: |
            AlencarSoftTVBOX-Clang/alencarsoft_tvbox_csky
            AlencarSoftTVBOX-Clang/alencarsoft_tvbox_csky_v2
            AlencarSoftTVBOX-Clang/mini_test
            AlencarSoftTVBOX-Clang/nostdlib_test

  build-mips:
    name: Build para Availink AVL2569D (Cinebox, Duosat, Tuning / MIPS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v3

      - name: Instalar compilador MIPS cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mips-linux-gnu gcc-mipsel-linux-gnu file

      - name: Compilar binarios MIPS Estaticos
        run: |
          cd AlencarSoftTVBOX-Clang
          # MIPS Big Endian Estatico
          mips-linux-gnu-gcc -static -O2 -Wall -Wextra -Iinclude -D_GNU_SOURCE \
            src/main.c \
            src/framebuffer.c \
            src/font.c \
            src/platform.c \
            src/display_vfd.c \
            src/input.c \
            src/iptv_catalog.c \
            src/player.c \
            -o alencarsoft_tvbox_mips_be
          mips-linux-gnu-strip alencarsoft_tvbox_mips_be || true
            
          # MIPS Little Endian (MIPSEL) Estatico
          mipsel-linux-gnu-gcc -static -O2 -Wall -Wextra -Iinclude -D_GNU_SOURCE \
            src/main.c \
            src/framebuffer.c \
            src/font.c \
            src/platform.c \
            src/display_vfd.c \
            src/input.c \
            src/iptv_catalog.c \
            src/player.c \
            -o alencarsoft_tvbox_mips_le
          mipsel-linux-gnu-strip alencarsoft_tvbox_mips_le || true
            
          echo "SUCESSO: Binarios MIPS gerados com sucesso!"
          file alencarsoft_tvbox_mips_*
          ls -lh alencarsoft_tvbox_mips_*

      - name: Upload Artifact MIPS
        uses: actions/upload-artifact@v4
        with:
          name: alencarsoft_tvbox_mips
          path: |
            AlencarSoftTVBOX-Clang/alencarsoft_tvbox_mips_be
            AlencarSoftTVBOX-Clang/alencarsoft_tvbox_mips_le

  release:
    name: Publicar Release com Binarios Nativos
    needs: [build-csky, build-mips]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v3

      - name: Criar pasta de release
        run: mkdir -p release_files

      - name: Download Artifact C-SKY
        uses: actions/download-artifact@v4
        with:
          name: alencarsoft_tvbox_csky
          path: release_files/

      - name: Download Artifact MIPS
        uses: actions/download-artifact@v4
        with:
          name: alencarsoft_tvbox_mips
          path: release_files/

      - name: Copiar arquivos complementares
        run: |
          find release_files/ -type f -exec mv -f {} release_files/ \; 2>/dev/null || true
          cp AlencarSoftTVBOX-Clang/iptv.m3u8 release_files/
          ls -la release_files/

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: "v1.0.5-native"
          name: "AlencarSoft TVBOX - Versao Nativa Estavel v1.0.5"
          draft: false
          prerelease: false
          overwrite: true
          files: release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
