name: Build AlencarSoft TVBOX Binaries

on:
  push:
    branches: [ main, codex/azamerica-ir ]
  workflow_dispatch:

jobs:
  test-native:
    name: Testar parser HLS em Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Compilar e executar testes C
        run: |
          cd AlencarSoftTVBOX-Clang
          gcc -std=c99 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined \
            -Iinclude tests/hls_playlist_test.c src/hls_playlist.c -o hls_playlist_test
          ./hls_playlist_test
          gcc -std=gnu99 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined \
            -D_GNU_SOURCE -Iinclude tests/hls_bridge_harness.c src/hls_bridge.c \
            src/hls_playlist.c -lpthread -o hls_bridge_harness
          python3 tests/test_hls_bridge.py ./hls_bridge_harness
          wget --tries=3 --timeout=60 -q \
            "https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-3.6.7/mbedtls-3.6.7.tar.bz2" \
            -O /tmp/mbedtls-3.6.7.tar.bz2
          echo "a7e8bcbec0e6f761b4af24f25677626b35f762f68eef79c08677a363212d11f6  /tmp/mbedtls-3.6.7.tar.bz2" | sha256sum -c -
          tar -xf /tmp/mbedtls-3.6.7.tar.bz2 -C /tmp
          make -C /tmp/mbedtls-3.6.7 lib -j2
          gcc -std=gnu99 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined \
            -D_GNU_SOURCE -DHLS_WITH_MBEDTLS -Iinclude \
            -I/tmp/mbedtls-3.6.7/include \
            tests/hls_bridge_harness.c src/hls_bridge.c src/hls_playlist.c src/hls_tls.c \
            /tmp/mbedtls-3.6.7/library/libmbedtls.a \
            /tmp/mbedtls-3.6.7/library/libmbedx509.a \
            /tmp/mbedtls-3.6.7/library/libmbedcrypto.a \
            -lpthread -o hls_bridge_tls_harness
          HLS_TEST_TLS=1 python3 tests/test_hls_bridge.py ./hls_bridge_tls_harness
          gcc -std=gnu99 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined \
            -D_GNU_SOURCE -Iinclude tests/firmware_dlna_harness.c \
            src/firmware_dlna.c -lpthread -o firmware_dlna_harness
          python3 tests/test_firmware_dlna.py ./firmware_dlna_harness

  build-csky:
    name: Build para Azamerica S1009+ (NationalChip GX6622 / C-SKY)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v3

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y lib32z1 lib32stdc++6 file wget python3

      - name: Baixar Toolchain NationalChip C-SKY (Linux 3.0.8 / CK610)
        run: |
          mkdir -p /opt/csky-toolchain
          wget --tries=3 --timeout=60 -q "https://launchpadlibrarian.net/433579941/csky-linux-tools-uclibc-2.8.01_1.0.0.0.tar.xz" -O /tmp/csky_pkg.tar.xz
          echo "444cccfe0f0f1888a8975ba460413a01da87f06275d6546e1df90a29d620b4b2  /tmp/csky_pkg.tar.xz" | sha256sum -c -
          tar -xf /tmp/csky_pkg.tar.xz -C /tmp
          tar -xf /tmp/csky-linux-tools-uclibc-2.8.01/csky-linux-tools-uclibc-20170724.tar.xz -C /opt/csky-toolchain
          echo "Toolchain NationalChip C-SKY extraida com sucesso."

      - name: Compilar binario C-SKY Estatico
        run: |
          CC_BIN="/opt/csky-toolchain/csky-linux-tools-uclibc-20170724/bin/csky-linux-gcc"
          STRIP_BIN="/opt/csky-toolchain/csky-linux-tools-uclibc-20170724/bin/csky-linux-strip"
          echo "Compilador selecionado: $CC_BIN"
          export PATH="/opt/csky-toolchain/csky-linux-tools-uclibc-20170724/bin:$PATH"
          $CC_BIN -v
          wget --tries=3 --timeout=60 -q \
            "https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-3.6.7/mbedtls-3.6.7.tar.bz2" \
            -O /tmp/mbedtls-3.6.7.tar.bz2
          echo "a7e8bcbec0e6f761b4af24f25677626b35f762f68eef79c08677a363212d11f6  /tmp/mbedtls-3.6.7.tar.bz2" | sha256sum -c -
          tar -xf /tmp/mbedtls-3.6.7.tar.bz2 -C /tmp
          make -C /tmp/mbedtls-3.6.7 lib \
            CC="$CC_BIN" AR="/opt/csky-toolchain/csky-linux-tools-uclibc-20170724/bin/csky-linux-ar" \
            CFLAGS="-O2 -std=gnu99" -j2
          
          cd AlencarSoftTVBOX-Clang
          
          # Compila o aplicativo AlencarSoft TVBOX estatico com o toolchain oficial NationalChip
          $CC_BIN -static -std=gnu99 -O2 -Wall -Wextra -Iinclude -D_GNU_SOURCE \
            -DHLS_WITH_MBEDTLS -DRECEIVER_DLNA_BACKEND -I/tmp/mbedtls-3.6.7/include \
            src/main.c src/framebuffer.c src/font.c src/platform.c src/display_vfd.c \
            src/input.c src/iptv_catalog.c src/player.c src/firmware_dlna.c \
            src/hls_bridge.c src/hls_playlist.c src/hls_tls.c \
            /tmp/mbedtls-3.6.7/library/libmbedtls.a \
            /tmp/mbedtls-3.6.7/library/libmbedx509.a \
            /tmp/mbedtls-3.6.7/library/libmbedcrypto.a \
            -lpthread -o alencarsoft_tvbox_csky

          # Diagnostico somente de leitura da ABI GXAV do receptor.
          $CC_BIN -static -std=gnu99 -O2 -Wall -Wextra \
            tools/gxav_probe.c -o gxav_probe_csky

          # Teste isolado do caminho MPEG-TS -> demux DVB -> decodificador.
          $CC_BIN -static -std=gnu99 -O2 -Wall -Wextra \
            tools/dvb_native_probe.c -o dvb_native_probe_csky

          $CC_BIN -static -std=gnu99 -O2 -Wall -Wextra -Iinclude -D_GNU_SOURCE \
            -DHLS_WITH_MBEDTLS -I/tmp/mbedtls-3.6.7/include \
            tests/hls_bridge_harness.c src/hls_bridge.c src/hls_playlist.c src/hls_tls.c \
            /tmp/mbedtls-3.6.7/library/libmbedtls.a \
            /tmp/mbedtls-3.6.7/library/libmbedx509.a \
            /tmp/mbedtls-3.6.7/library/libmbedcrypto.a \
            -lpthread -o hls_bridge_probe_csky
          
          # Compila mini_test de diagnostico
          $CC_BIN -static -std=gnu99 -O2 mini_test.c -o mini_test
          
          # Strip para reduzir tamanho
          $STRIP_BIN alencarsoft_tvbox_csky || true
          $STRIP_BIN mini_test || true
          $STRIP_BIN gxav_probe_csky || true
          $STRIP_BIN dvb_native_probe_csky || true
          $STRIP_BIN hls_bridge_probe_csky || true
          
          echo "SUCESSO: Binarios C-SKY gerados com sucesso pelo toolchain oficial NationalChip!"
          file alencarsoft_tvbox_csky mini_test
          ls -lh alencarsoft_tvbox_csky mini_test

      - name: Upload Artifact C-SKY
        uses: actions/upload-artifact@v4
        with:
          name: alencarsoft_tvbox_csky
          path: |
            AlencarSoftTVBOX-Clang/alencarsoft_tvbox_csky
            AlencarSoftTVBOX-Clang/mini_test

      - name: Upload GXAV ABI probe
        uses: actions/upload-artifact@v4
        with:
          name: gxav-probe-csky
          path: AlencarSoftTVBOX-Clang/gxav_probe_csky

      - name: Upload DVB playback probe
        uses: actions/upload-artifact@v4
        with:
          name: dvb-native-probe-csky
          path: AlencarSoftTVBOX-Clang/dvb_native_probe_csky

      - name: Upload transport-only probe
        uses: actions/upload-artifact@v4
        with:
          name: hls-bridge-probe-csky
          path: AlencarSoftTVBOX-Clang/hls_bridge_probe_csky

  build-mips:
    name: Build para Availink AVL2569D (Cinebox, Duosat, Tuning / MIPS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v3

      - name: Instalar compilador MIPS cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mips-linux-gnu gcc-mipsel-linux-gnu file

      - name: Compilar binarios MIPS Estaticos
        run: |
          cd AlencarSoftTVBOX-Clang
          # MIPS Big Endian Estatico
          mips-linux-gnu-gcc -static -O2 -Wall -Wextra -Iinclude -D_GNU_SOURCE \
            src/main.c \
            src/framebuffer.c \
            src/font.c \
            src/platform.c \
            src/display_vfd.c \
            src/input.c \
            src/iptv_catalog.c \
            src/player.c \
            src/hls_bridge.c \
            src/hls_playlist.c \
            -lpthread \
            -o alencarsoft_tvbox_mips_be
          mips-linux-gnu-strip alencarsoft_tvbox_mips_be || true
            
          # MIPS Little Endian (MIPSEL) Estatico
          mipsel-linux-gnu-gcc -static -O2 -Wall -Wextra -Iinclude -D_GNU_SOURCE \
            src/main.c \
            src/framebuffer.c \
            src/font.c \
            src/platform.c \
            src/display_vfd.c \
            src/input.c \
            src/iptv_catalog.c \
            src/player.c \
            src/hls_bridge.c \
            src/hls_playlist.c \
            -lpthread \
            -o alencarsoft_tvbox_mips_le
          mipsel-linux-gnu-strip alencarsoft_tvbox_mips_le || true
            
          echo "SUCESSO: Binarios MIPS gerados com sucesso!"
          file alencarsoft_tvbox_mips_*
          ls -lh alencarsoft_tvbox_mips_*

      - name: Upload Artifact MIPS
        uses: actions/upload-artifact@v4
        with:
          name: alencarsoft_tvbox_mips
          path: |
            AlencarSoftTVBOX-Clang/alencarsoft_tvbox_mips_be
            AlencarSoftTVBOX-Clang/alencarsoft_tvbox_mips_le

  release:
    name: Publicar Release com Binarios Nativos
    needs: [test-native, build-csky, build-mips]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v3

      - name: Criar pasta de release
        run: mkdir -p release_files

      - name: Download Artifact C-SKY
        uses: actions/download-artifact@v4
        with:
          name: alencarsoft_tvbox_csky
          path: release_files/

      - name: Download Artifact MIPS
        uses: actions/download-artifact@v4
        with:
          name: alencarsoft_tvbox_mips
          path: release_files/

      - name: Copiar arquivos complementares
        run: |
          find release_files/ -type f -exec mv -f {} release_files/ \; 2>/dev/null || true
          cp AlencarSoftTVBOX-Clang/iptv.m3u8 release_files/
          ls -la release_files/

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: "v1.0.8-native"
          name: "AlencarSoft TVBOX - Versao Nativa Estavel v1.0.8 (NationalChip Toolchain)"
          draft: false
          prerelease: false
          overwrite: true
          files: release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
