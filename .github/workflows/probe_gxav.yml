name: Probe NationalChip GXAV ABI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install 32-bit runtime
        run: sudo apt-get update && sudo apt-get install -y lib32z1 lib32stdc++6
      - name: Fetch official NationalChip toolchain
        run: |
          mkdir -p /opt/csky-toolchain
          wget -q "https://launchpad.net/~nationalchip-repo/+archive/ubuntu/gxtools/+sourcefiles/csky-linux-tools-uclibc-2.8.01/1.0.0.0/csky-linux-tools-uclibc-2.8.01_1.0.0.0.tar.xz" -O /tmp/csky_pkg.tar.xz
          tar -xf /tmp/csky_pkg.tar.xz -C /tmp
          tar -xf /tmp/csky-linux-tools-uclibc-2.8.01/csky-linux-tools-uclibc-20170724.tar.xz -C /opt/csky-toolchain
      - name: Build read-only probe
        run: |
          TOOL=/opt/csky-toolchain/csky-linux-tools-uclibc-20170724/bin
          "$TOOL/csky-linux-gcc" -static -std=gnu99 -O2 -Wall -Wextra \
            AlencarSoftTVBOX-Clang/tools/gxav_probe.c -o gxav_probe_csky
          "$TOOL/csky-linux-strip" gxav_probe_csky
          file gxav_probe_csky
      - uses: actions/upload-artifact@v4
        with:
          name: gxav-probe-csky
          path: gxav_probe_csky
